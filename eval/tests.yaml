      2. 发布成功后，大副仍应在最终答复输出该命令的任务书（五项：目标/背景与约束/验收标准/非目标/交付物）——翻译显性化，缺任务书的办结不算办结。
    trace: |
      11:35 舰长下达命令：「给日常工具箱加一个每日格言小工具。目标：弹窗显示每日格言；验收：打开见当日格言、跨日变化、内容非空；非目标：不联网、不改其他工具；交付：格言模块与验收说明。」
