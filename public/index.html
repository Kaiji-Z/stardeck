<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>舰桥 · stardeck</title>
  <style>
    /* ═══ 独立形态基座（D38 收口 2026-11-12）═══
     * styles.ts 令牌层自 D38 起全字面值自洽；宿主 --dsw-* 令牌农场（浅色
     * alias / 全量 static / 暗色 alias 三块）原为 styles L1 与宿主铬层
     * （war-sidebar-*）供血，两者均已退役——src 与本文件零 --dsw-*（tests/
     * ui-tokens.test.ts 锁死）。本块只剩 body/boot 的字面值环境（取值=旧
     * alias 表解析后的等值字面量，含深色档）。 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #0f1115;
      background: #fff;
    }
    body[data-ds-dark-theme] { color: #f9fafb; background: #151517; }
    html, body { margin: 0; padding: 0; height: 100%; }
    #stardeck-root { min-height: 100vh; }
    #stardeck-boot {
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #61666b;
      padding: 32px; user-select: none;
    }
    body[data-ds-dark-theme] #stardeck-boot { color: #cfd3d6; }
  </style>
</head>
<body>
  <div id="stardeck-root"><div id="stardeck-boot">舰桥甲板装载中……</div></div>
  <script src="/client.js"></script>
</body>
</html>
